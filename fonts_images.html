<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Life Logs — Practical 02: Fonts & Photo Dumps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Syne:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0d1117;
      --bg-panel: rgba(22, 27, 34, 0.8);
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --text-heading: #f0f6fc;
      --accent-blue: #58a6ff;
      --font-title: 'Syne', sans-serif;
      --font-display: 'Cinzel', serif;
      --font-code: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-title);
      min-height: 100vh;
      padding: 2.5rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-code);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .back-btn:hover { color: var(--accent-blue); }
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 900px;
      margin: 0 auto;
      backdrop-filter: blur(20px);
    }
    .font-sample-1 { font-family: var(--font-display); font-size: 1.8rem; color: var(--text-heading); margin-bottom: 1rem; }
    .font-sample-2 { font-family: var(--font-code); font-size: 1rem; color: var(--accent-blue); margin-bottom: 2rem; }
    
    .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem; }
    .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }
    @media (max-width: 650px) {
      body { padding: 1rem; }
      .panel { padding: 1.25rem; }
      .font-sample-1 { font-size: 1.35rem; line-height: 1.2; }
      .font-sample-2 { font-size: 0.78rem; overflow-wrap: anywhere; }
      .gallery { grid-template-columns: 1fr; gap: 1rem; }
      .gallery img { height: auto; aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html" class="back-btn">&larr; BACK TO MASTER WORKSPACE</a>

    <div class="font-sample-1">A GOOD FONT CAN FEEL LIKE A MEMORY</div>
    <div class="font-sample-2">photo dump // coffee foam // sunset walk // repeat</div>

    <p style="color: var(--text-muted);">A tiny moodboard from an ordinary day: the drink I ordered, the place I sat, and the view I almost walked past.</p>

    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=600&q=80" alt="Coffee waiting on a cafe table">
      <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80" alt="A warm evening view">
    </div>
  </div>
</body>
</html>
